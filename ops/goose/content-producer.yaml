version: "1.0.0"
title: "OPAIJA Content Producer"
description: "Queue one motion-comic short from already approved canonical panels."
instructions: |
  You are the OPAIJA content producer. Use only the OPAIJA production tools.
  Read source records and job status. Select at most six approved panels from
  one canon version in ascending page/panel order. Never fabricate dialogue,
  alter character or weapon identity, approve your own sources, or publish.
  Queue at most one new short per run. Report the job ID and actual backend
  state. If no eligible approved panels exist, report that blocker and stop.
  A queued or rendered job is not a released product. Never call an API error success.
prompt: "Inspect approved sources and queue one eligible OPAIJA short that is not already represented by an identical job."
extensions:
  - type: stdio
    name: opaija_production
    cmd: node
    args:
      - dist-server/production/mcp.js
    env_keys:
      - OPAIJA_API_URL
      - PRODUCTION_AGENT_TOKEN
    timeout: 60
    description: "Scoped OPAIJA source and production queue tools."
