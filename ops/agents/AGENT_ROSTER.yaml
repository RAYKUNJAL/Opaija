# OPAIJA Agent Roster — 15 Core Production Agents
# Each agent follows the 6-step memory loop (see docs/SWARM_MEMORY_ARCHITECTURE.md)
#
# File locations (all relative to project root):
#   memory/MESSAGE_BUS.jsonl  — append-only agent communication
#   memory/LEARNINGS.jsonl    — cross-episode lessons
#   memory/CANON_MEMORY.json  — flattened canon (generated, do not edit)
#   episodes/epNN/EPISODE_STATE.json — per-episode working memory
#
# The 6-step loop EVERY agent follows on each invocation:
#   1. LOAD: read CANON_MEMORY.json + LEARNINGS.jsonl (filtered to self)
#           + new MESSAGE_BUS entries addressed to self + EPISODE_STATE.json
#   2. DO:   perform this agent's job
#   3. WRITE: output artifacts to episodes/epNN/
#   4. POST: append to MESSAGE_BUS.jsonl — what was done, what's next, who's next
#   5. LEARN: if something went wrong or was corrected, append to LEARNINGS.jsonl
#   6. UPDATE: set EPISODE_STATE.json stage/flags for the next agent's gate

# =============================================================================
# STAGE PIPELINE (Orchestrator fires agents in this order per episode)
# =============================================================================
#
# script_draft → canon_review → visual_prep → voice → clips → manifest → render → qa → publish
#
# Stage            Agent                    Gate condition
# ───────────────  ───────────────────────  ──────────────────────────────
# script_draft     Script Writer            (start)
# canon_review     Canon Guardian           script_approved == true
# visual_prep      Visual Design Agent      canon_checked == true
# voice            Voice Director           visual_refs_locked == true
# clips            Seedance Packager        voice_generated == true
# manifest         Remotion Editor          clips_generated == true
# render           Render Agent             manifest_built == true
# qa               QA Agent                 render_complete == true
# publish          Social Scheduler         qa_passed == true

# =============================================================================
# AGENTS
# =============================================================================

agents:
  # ── STAGE 1: script_draft ──────────────────────────────────────────────
  - id: script-writer
    name: "Script Writer"
    team: Goose
    stage: script_draft
    gate: null  # fires first
    role: >
      Writes the episode narrator script from QUEUE.json episode data.
      Produces a 130-170 word Web-Teller narration hitting all five beats
      (HOOK, CONFLICT, REVEAL, ESCALATION, CLIFFHANGER).
      Doubles moment MUST appear. Patois max 2-3 lines, character dialogue only.
    inputs:
      - memory/CANON_MEMORY.json
      - data/shared-memory/QUEUE.json (episode entry)
      - data/scripts/SCRIPT_AGENT_BRIEF.md
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Script Writer")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Script Writer")
    outputs:
      - episodes/epNN/script_v1.md
    on_complete:
      post_message_bus:
        to: "Canon Guardian"
        topic: "epNN.script_ready_for_review"
        body: "Script v1 for EPxxx written. Awaiting canon review."
      set_flags:
        script_approved: false  # awaiting canon review
      set_stage: canon_review
    learnings_trigger: "If Canon Guardian finds 'slaves' instead of 'enslaved Africans', or violates villain reveal schedule, or missing doubles moment"

  # ── STAGE 2: canon_review ─────────────────────────────────────────────
  - id: canon-guardian
    name: "Canon Guardian"
    team: Guardrails
    stage: canon_review
    gate: "script_approved == false && script exists"
    role: >
      Reviews script against ALL canon rules: language (enslaved Africans),
      villain reveal schedule, Selah appearance, doubles rule, patois limits,
      power system limits, style locks. Either approves or blocks with
      specific line-level corrections. If blocking, posts corrections to
      Script Writer via MESSAGE_BUS and resets stage to script_draft.
    inputs:
      - memory/CANON_MEMORY.json
      - episodes/epNN/script_v1.md (or latest version)
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Canon Guardian")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Canon Guardian")
    outputs:
      - episodes/epNN/canon_check.md
    on_complete:
      post_message_bus:
        to: "Visual Design Agent"
        topic: "epNN.script_canon_approved"
        body: "EPxxx script passed canon review. Visual prep can begin."
      set_flags:
        script_approved: true
        canon_checked: true
      set_stage: visual_prep
    on_block:
      post_message_bus:
        to: "Script Writer"
        topic: "epNN.canon_violation"
        body: "Specific violations listed in canon_check.md"
      set_stage: script_draft  # back to writer
    learnings_trigger: "Any recurring violation pattern — especially if Script Writer repeats the same mistake across episodes"

  # ── STAGE 3: visual_prep ──────────────────────────────────────────────
  - id: visual-design-agent
    name: "Visual Design Agent"
    team: Goose
    stage: visual_prep
    gate: "canon_checked == true"
    role: >
      Builds Seedance reference packs: character model sheets, pose sheets,
      environment backgrounds, and visual style guides for this episode's
      characters and locations. Locks visual references so downstream agents
      (Seedance Packager, Remotion Editor) use consistent character art.
      Enforces Caribbean Glyph-Cel 2.5D Hybrid style: rounded chins, full lips,
      Afro-textured hair, broad facial structures. NEVER V-shaped anime chins.
    inputs:
      - memory/CANON_MEMORY.json (visual_style, characters, style_locks)
      - episodes/epNN/script_v1.md (latest approved version)
      - data/scripts/SCRIPT_AGENT_BRIEF.md (style lock section)
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Visual Design Agent")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Visual Design Agent")
    outputs:
      - episodes/epNN/visual_ref_pack/ (character refs, bg refs, pose sheets)
      - episodes/epNN/visual_ref_manifest.json
    on_complete:
      post_message_bus:
        to: "Voice Director"
        topic: "epNN.visual_refs_locked"
        body: "Visual reference pack complete for EPxxx. Voice stage can begin."
      set_flags:
        visual_refs_locked: true
      set_stage: voice
    learnings_trigger: "Seedance rejections due to style drift, character inconsistency, or generic anime faces"

  # ── STAGE 4: voice ────────────────────────────────────────────────────
  - id: voice-director
    name: "Voice Director"
    team: Paperclip
    stage: voice
    gate: "visual_refs_locked == true && script_approved == true"
    role: >
      Generates narrator voiceover (The Web-Teller) via ElevenLabs.
      Produces narration.mp3 and word-level alignment (for beat timing).
      Voice must be wise, rhythmic, weighty — Caribbean cadence in standard
      English (NOT patois). Patois lives in character dialogue only.
      Creates voice map for future character voices if needed this episode.
    inputs:
      - memory/CANON_MEMORY.json (narration_style, format)
      - episodes/epNN/script_v1.md (approved script)
      - episodes/epNN/visual_ref_manifest.json
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Voice Director")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Voice Director")
    outputs:
      - episodes/epNN/narration.mp3
      - episodes/epNN/alignment.json
      - episodes/epNN/voice_map.json
    on_complete:
      post_message_bus:
        to: "Seedance Packager"
        topic: "epNN.voice_ready"
        body: "Narration and alignment for EPxxx complete. Clip generation can begin."
      set_flags:
        voice_generated: true
      set_stage: clips
    learnings_trigger: "ElevenLabs voice drift, pacing issues, alignment errors, patois bleeding into narration"

  # ── STAGE 5: clips ────────────────────────────────────────────────────
  - id: seedance-packager
    name: "Seedance Packager"
    team: Paperclip
    stage: clips
    gate: "voice_generated == true"
    role: >
      Builds Seedance 2.0 video prompts for each beat, using locked visual
      references and word-level alignment timing. Calls fal.ai Seedance API
      to generate per-beat video clips. Each clip must match the Caribbean
      Glyph-Cel style, use correct character refs, and land strikes on beat.
      MUST specify 'wooden bois, hand-carved, Trinidad kalinda style' in prompts
      — never just 'stick' or Seedance generates a generic staff.
      Jabari's drums must be described as 'African style wooden drums, L-shaped
      curved sticks' — never modern drum kit.
    inputs:
      - memory/CANON_MEMORY.json (characters, visual_style, combat_visual_language)
      - episodes/epNN/visual_ref_pack/
      - episodes/epNN/narration.mp3
      - episodes/epNN/alignment.json
      - episodes/epNN/script_v1.md
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Seedance Packager")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Seedance Packager")
    outputs:
      - episodes/epNN/clips/ (beat-01.mp4, beat-02.mp4, ...)
      - episodes/epNN/prompts.json
    on_complete:
      post_message_bus:
        to: "Remotion Editor"
        topic: "epNN.clips_ready"
        body: "All beat clips for EPxxx generated. Manifest and assembly can begin."
      set_flags:
        clips_generated: true
      set_stage: manifest
    learnings_trigger: "Every Seedance rejection, style drift, generic weapon, wrong drum type, face style violation"

  # ── STAGE 6: manifest ─────────────────────────────────────────────────
  - id: remotion-editor
    name: "Remotion Editor"
    team: Paperclip
    stage: manifest
    gate: "clips_generated == true"
    role: >
      Assembles Seedance clips, stills, voiceover, captions, and motion into
      a Remotion composition manifest. Builds the 9:16 vertical edit with
      correct beat timing, caption overlays, and audio sync. Produces the
      render manifest that the Render Agent will execute.
    inputs:
      - memory/CANON_MEMORY.json (format, episode_beat_map)
      - episodes/epNN/clips/
      - episodes/epNN/narration.mp3
      - episodes/epNN/alignment.json
      - episodes/epNN/script_v1.md
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Remotion Editor")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Remotion Editor")
    outputs:
      - episodes/epNN/manifest.json
    on_complete:
      post_message_bus:
        to: "Render Agent"
        topic: "epNN.manifest_ready"
        body: "Remotion manifest for EPxxx built. Ready for render."
      set_flags:
        manifest_built: true
      set_stage: render
    learnings_trigger: "Caption timing errors, audio drift, clip ordering mistakes, aspect ratio issues"

  # ── STAGE 7: render ───────────────────────────────────────────────────
  - id: render-agent
    name: "Render Agent"
    team: Paperclip
    stage: render
    gate: "manifest_built == true"
    role: >
      Executes the Remotion render from manifest.json. Produces the final
      9:16 MP4 at 1080x1920, 30fps, with embedded captions and synced audio.
      Verifies output file integrity and runtime (must be 60-90s).
    inputs:
      - episodes/epNN/manifest.json
      - episodes/epNN/clips/
      - episodes/epNN/narration.mp3
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Render Agent")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Render Agent")
    outputs:
      - episodes/epNN/EPxxx_final.mp4
      - episodes/epNN/render_log.json
    on_complete:
      post_message_bus:
        to: "QA Agent"
        topic: "epNN.render_complete"
        body: "Final render for EPxxx complete. QA can begin."
      set_flags:
        render_complete: true
      set_stage: qa
    learnings_trigger: "Render failures, runtime violations, encoding errors, audio sync drift"

  # ── STAGE 8: qa ───────────────────────────────────────────────────────
  - id: qa-agent
    name: "QA Agent"
    team: Guardrails
    stage: qa
    gate: "render_complete == true"
    role: >
      Final quality gate. Checks: runtime 60-90s, doubles moment present,
      canon compliance (no 'slaves', villain reveal respected, Selah not
      early), visual style (no V-chins, no thin lips, correct hair), audio
      quality, caption accuracy, patois limits. Produces pass/fail report.
      If fail, posts specific failures to responsible agent and resets stage.
    inputs:
      - memory/CANON_MEMORY.json
      - episodes/epNN/EPxxx_final.mp4
      - episodes/epNN/script_v1.md
      - episodes/epNN/manifest.json
      - episodes/epNN/canon_check.md
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "QA Agent")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "QA Agent")
    outputs:
      - episodes/epNN/qa_report.md
    on_complete:
      post_message_bus:
        to: "Social Scheduler"
        topic: "epNN.qa_passed"
        body: "EPxxx passed all QA checks. Ready for publish."
      set_flags:
        qa_passed: true
        ready_to_publish: true
      set_stage: publish
    on_fail:
      post_message_bus:
        to: "<responsible agent>"
        topic: "epNN.qa_failed"
        body: "Specific failures listed in qa_report.md"
      set_stage: "<failed stage>"  # back to whichever stage failed
    learnings_trigger: "Any QA failure that represents a recurring pattern — visual style drift, missing doubles, runtime violations"

  # ── STAGE 9: publish ──────────────────────────────────────────────────
  - id: social-scheduler
    name: "Social Scheduler"
    team: Revenue
    stage: publish
    gate: "qa_passed == true"
    role: >
      Packages the final episode for publishing. Writes captions, hashtags,
      and platform-specific metadata. Schedules to YouTube Shorts, TikTok,
      and Instagram Reels. Updates CONTENT_LOG.json after publishing.
      Does NOT auto-publish until QUEUE.json prelaunch_rule is satisfied
      (12 episodes complete, 30 days teaser, character sheets locked, trailer done).
    inputs:
      - memory/CANON_MEMORY.json (platforms, patois_expressions)
      - episodes/epNN/EPxxx_final.mp4
      - data/shared-memory/QUEUE.json (prelaunch_rule)
      - data/shared-memory/CONTENT_LOG.json
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Social Scheduler")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Social Scheduler")
    outputs:
      - episodes/epNN/publish_manifest.json
      - updates to data/shared-memory/CONTENT_LOG.json
    on_complete:
      post_message_bus:
        to: "all"
        topic: "epNN.published"
        body: "EPxxx published to all platforms."
      set_stage: done
    learnings_trigger: "Audience retention signals, engagement metrics, best posting times, hook performance"

  # ── SUPPORTING AGENTS (not in main pipeline, triggered by MESSAGE_BUS) ──

  - id: action-choreographer
    name: "Action Choreographer"
    team: Goose
    stage: null  # triggered by message, not pipeline stage
    gate: null
    role: >
      Builds anime fight timing, pose transitions, camera motion, and
      readable action continuity for fight scenes. Triggered by Visual
      Design Agent or Seedance Packager when a fight scene needs choreography.
      Produces fight beat boards and shot choreography.
    inputs:
      - memory/CANON_MEMORY.json (power_system, combat_visual_language)
      - episodes/epNN/script_v1.md
      - memory/LEARNINGS.jsonl (filtered: apply_to contains "Action Choreographer")
      - memory/MESSAGE_BUS.jsonl (entries addressed to "Action Choreographer")
    outputs:
      - episodes/epNN/fight_choreography.md
    on_complete:
      post_message_bus:
        to: "<requesting agent>"
        topic: "epNN.choreography_ready"
        body: "Fight choreography for EPxxx complete."
    learnings_trigger: "Unreadable action, pose continuity errors, timing that doesn't land on beat"

  - id: cinematic-fx-director
    name: "Cinematic FX Director"
    team: Goose
    stage: null
    gate: null
    role: >
      Creates Opaija's special effects language: impact frames, power
      visuals, rhythm glyph designs, Silence Crack effects, and camera
      energy. Triggered by Visual Design Agent for episodes with power
      activation scenes.
    inputs:
      - memory/CANON_MEMORY.json (combat_visual_language)
      - episodes/epNN/script_v1.md
      - memory/LEARNINGS.jsonl
      - memory/MESSAGE_BUS.jsonl (entries to "Cinematic FX Director")
    outputs:
      - episodes/epNN/fx_brief.md
    on_complete:
      post_message_bus:
        to: "Seedance Packager"
        topic: "epNN.fx_ready"
        body: "FX brief for EPxxx complete."
    learnings_trigger: "FX that don't match canon visual language, Silence Crack inconsistencies"

  - id: archive-clerk
    name: "Archive Clerk"
    team: Paperclip
    stage: null
    gate: null
    role: >
      Keeps bibles, prompts, scripts, files, and decisions organized.
      Maintains the asset index and canon changelog. Triggered after
      every episode completion to archive all artifacts and update
      the master asset index.
    inputs:
      - episodes/epNN/ (all artifacts)
      - memory/CANON_MEMORY.json
      - memory/LEARNINGS.jsonl
      - memory/MESSAGE_BUS.jsonl (entries to "Archive Clerk")
    outputs:
      - episodes/epNN/asset_index.json
      - data/canon_changelog.md
    on_complete:
      post_message_bus:
        to: "all"
        topic: "epNN.archived"
        body: "EPxxx artifacts archived and indexed."
    learnings_trigger: "Missing artifacts, broken paths, naming inconsistencies"

  - id: lore-guardian
    name: "Lore Guardian"
    team: Guardrails
    stage: null
    gate: null
    role: >
      Checks cultural specificity, historical language, folklore use, and
      continuity across episodes. Distinct from Canon Guardian (which checks
      rule compliance per episode) — Lore Guardian tracks cross-episode
      continuity and cultural authenticity. Triggered by Canon Guardian
      when a cultural question arises, or proactively after each episode.
    inputs:
      - memory/CANON_MEMORY.json
      - episodes/ (all episodes for cross-episode continuity)
      - memory/LEARNINGS.jsonl
      - memory/MESSAGE_BUS.jsonl (entries to "Lore Guardian")
    outputs:
      - episodes/epNN/cultural_review.md
    on_complete:
      post_message_bus:
        to: "Canon Guardian"
        topic: "epNN.cultural_review_complete"
        body: "Cultural review for EPxxx complete."
    learnings_trigger: "Cultural inaccuracies, folklore misuse, continuity breaks across episodes"

  - id: tribe-growth-commander
    name: "Tribe Growth Commander"
    team: Revenue
    stage: null
    gate: null
    role: >
      Coordinates organic social, paid ads, email capture, founder drops,
      story blog, and weekly growth memory. Reads audience metrics and
      writes retention signals to LEARNINGS.jsonl so creative agents can
      improve. Triggered after episodes are published.
    inputs:
      - data/shared-memory/CONTENT_LOG.json
      - memory/LEARNINGS.jsonl
      - memory/MESSAGE_BUS.jsonl (entries to "Tribe Growth Commander")
    outputs:
      - data/growth/weekly_report.md
      - memory/LEARNINGS.jsonl (retention_signal entries)
    on_complete:
      post_message_bus:
        to: "Storyboard Agent, Social Scheduler"
        topic: "growth.retention_signal"
        body: "New retention data available. See weekly report."
    learnings_trigger: "Retention patterns, hook performance, platform algorithm changes"

  # ── META: Orchestrator ─────────────────────────────────────────────────
  - id: orchestrator
    name: "Orchestrator"
    team: Brain
    stage: null
    gate: null
    role: >
      Polling loop. Reads EPISODE_STATE.json's 'stage' field, finds the
      agent whose 'stage' matches, checks its gate condition against
      EPISODE_STATE.json flags, and fires that agent. If gate condition
      is not met, waits. If all agents are done, reports episode complete.
      Implemented as scripts/swarm-orchestrator.ts.
    inputs:
      - episodes/epNN/EPISODE_STATE.json
      - ops/agents/AGENT_ROSTER.yaml (this file)
    outputs:
      - console logs
      - episodes/epNN/orchestrator.log.jsonl
